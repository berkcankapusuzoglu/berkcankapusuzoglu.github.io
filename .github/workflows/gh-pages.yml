name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.145.0'
          extended: true
      - name: Install asset test dependency
        run: python -m pip install Pillow==12.3.0
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build
        run: hugo --minify --panicOnWarning --printPathWarnings
      - name: Validate routes and HTML
        run: python scripts/site_check.py --public public --expected tests/expected-urls.txt
      - name: Install accessibility tooling
        run: npm ci
      - name: Check generated pages for accessibility
        run: npm run check:a11y
      - uses: actions/upload-artifact@v4
        with:
          name: site-public
          path: public/
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-public
          path: public/
      - name: Deploy existing Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public/
