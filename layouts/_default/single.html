{{ define "main" }}
  <article class="page-content">
    <header class="page-heading">
      <p class="eyebrow">{{ .Section | humanize }}</p>
      <h1>{{ .Title | default site.Title }}</h1>
      {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
    </header>
    {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  </article>
{{ end }}
