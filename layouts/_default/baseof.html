<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
  <head>{{ partial "head.html" . }}</head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    {{ partial "header.html" . }}
    <main id="main-content" class="site-main" tabindex="-1">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{ $navigation := resources.Get "js/navigation.js" | minify | fingerprint }}
    <script src="{{ $navigation.RelPermalink }}" defer></script>
  </body>
</html>
