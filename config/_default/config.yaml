# Configuration of Hugo
# Guide: https://wowchemy.com/docs/getting-started/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

title: Berkcan Kapusuzoglu # Website name
baseURL: 'https://berkcankapusuzoglu.github.io/' # Website URL
relativeURLs: true
uglyURLs: true
params:
  role: Staff Applied Researcher - AI Foundations
  positioning: I lead research and engineering for efficient, reliable language models.
  description: Applied AI research across language model reasoning, efficiency, and reliable machine learning systems.
  email: berkcankapusuzoglu@gmail.com
  github: https://github.com/berkcankapusuzoglu
  linkedin: https://www.linkedin.com/in/berkcankapusuzoglu/
  scholar: https://scholar.google.com/citations?user=iv1vNTYAAAAJ&hl=en&oi=ao

############################
## LANGUAGE
############################

defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## MODULES
############################

############################
## ADVANCED
############################
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [\.ipynb$, .ipynb_checkpoints$, \.Rmd$, \.Rmarkdown$, _cache$]
permalinks:
  event: '/talk/:slug/'
  tags: '/tag/:slug/'
  categories: '/category/:slug/'
  publication_types: '/publication-type/:slug/'
  blog: '/blog/:slug'
disableAliases: true
outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]
imaging:
  resampleFilter: lanczos
  quality: 75
  anchor: smart
timeout: 600000
taxonomies:
  tag: tags
  category: categories
  publication_type: publication_types
  author: authors
markup:
  _merge: deep
  tableofcontents:
    startLevel: 1 
    endLevel: 4
    ordered: false 
related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 70
security:
  _merge: deep
sitemap:
  _merge: deep
  
  
############################
## CUSTOM
############################

cascade:
  - _target:
      path: /blog/**
    share: false
  - _target:
      path: /publication/**
    share: false

lastmod: [":fileModTime", “:default”]
